# ===================================
# Task Management System - Production Environment
# ===================================
# Generated for TSK-006-ENV-docker-compose
# Project: Task Management System
# Environment: Production/Staging
# Purpose: Production deployment with security, monitoring, and scalability

version: "3.8"

# ===================================
# Networks
# ===================================
networks:
  task-management-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  task-management-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.23.0.0/16

# ===================================
# Volumes
# ===================================
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  nginx_ssl_certs:
    driver: local
  app_logs:
    driver: local
  backup_data:
    driver: local
  monitoring_data:
    driver: local

# ===================================
# Services
# ===================================
services:
  # ===================================
  # Reverse Proxy & Load Balancer
  # ===================================
  nginx:
    image: nginx:1.25.3-alpine
    container_name: task-management-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_ssl_certs:/etc/nginx/ssl:ro
      - app_logs:/var/log/nginx
    environment:
      TZ: UTC
    depends_on:
      - backend
      - frontend
    networks:
      task-management-prod:
        ipv4_address: 172.22.0.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ===================================
  # Database Services
  # ===================================
  postgres:
    image: postgres:16.1-alpine
    container_name: task-management-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      TZ: UTC
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-prod.sql:/docker-entrypoint-initdb.d/init-prod.sql:ro
      - backup_data:/backup
    networks:
      task-management-internal:
        ipv4_address: 172.23.0.10
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskdb}",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  redis:
    image: redis:7.2.4-alpine
    container_name: task-management-redis-prod
    restart: always
    environment:
      TZ: UTC
    volumes:
      - redis_prod_data:/data
      - ./infrastructure/docker/redis/redis-prod.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    networks:
      task-management-internal:
        ipv4_address: 172.23.0.11
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # ===================================
  # Backend Service (Production)
  # ===================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: task-management-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-taskdb}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: UTC
      # Security settings
      HELMET_ENABLED: true
      RATE_LIMIT_ENABLED: true
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-900000}
    volumes:
      - app_logs:/app/logs
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      task-management-prod:
        ipv4_address: 172.22.0.20
      task-management-internal:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ===================================
  # Frontend Service (Production)
  # ===================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: task-management-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      TZ: UTC
    volumes:
      - app_logs:/app/logs
    working_dir: /app
    depends_on:
      - backend
    networks:
      task-management-prod:
        ipv4_address: 172.22.0.30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ===================================
  # Monitoring Services
  # ===================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: task-management-prometheus-prod
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - monitoring_data:/prometheus
    environment:
      TZ: UTC
    networks:
      task-management-prod:
        ipv4_address: 172.22.0.40
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:10.2.2
    container_name: task-management-grafana-prod
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - monitoring_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      TZ: UTC
    depends_on:
      - prometheus
    networks:
      task-management-prod:
        ipv4_address: 172.22.0.41
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # ===================================
  # Backup Service
  # ===================================
  backup:
    image: postgres:16.1-alpine
    container_name: task-management-backup-prod
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskdb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: UTC
    volumes:
      - backup_data:/backup
      - ./scripts/backup:/scripts:ro
    command: /scripts/backup.sh
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      task-management-internal:
        ipv4_address: 172.23.0.50
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # ===================================
  # Log Aggregation
  # ===================================
  fluentd:
    image: fluent/fluentd:v1.16.2-debian-1.0
    container_name: task-management-fluentd-prod
    restart: always
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./infrastructure/logging/fluent.conf:/fluentd/etc/fluent.conf:ro
      - app_logs:/var/log/app
    environment:
      FLUENTD_CONF: fluent.conf
      TZ: UTC
    networks:
      task-management-prod:
        ipv4_address: 172.22.0.60
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # ===================================
  # Health Check Service
  # ===================================
  healthcheck:
    image: alpine:3.18
    container_name: task-management-healthcheck-prod
    restart: always
    command: |
      sh -c "
        apk add --no-cache curl &&
        while true; do
          curl -f http://nginx/health || echo 'Health check failed';
          sleep 60;
        done
      "
    depends_on:
      - nginx
      - backend
      - frontend
    networks:
      task-management-prod:
        ipv4_address: 172.22.0.70
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
