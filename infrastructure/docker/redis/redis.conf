# ===================================
# Task Management System - Redis Configuration (Development)
# ===================================
# Generated for TSK-014-INF-redis-config
# Project: Task Management System
# Component: Redis Cache Server
# Purpose: Redis configuration for development environment

# ===================================
# Basic Configuration
# ===================================

# Bind to all interfaces for development
bind 0.0.0.0

# Default port
port 6379

# TCP listen() backlog
tcp-backlog 511

# TCP keepalive
tcp-keepalive 300

# ===================================
# General Configuration
# ===================================

# Set server verbosity to 'notice'
# Options: debug, verbose, notice, warning
loglevel notice

# Specify the log file name
logfile ""

# Set the number of databases
databases 16

# ===================================
# Snapshotting Configuration
# ===================================

# Save the DB on disk for development
# Format: save <seconds> <changes>
save 900 1      # Save if at least 1 key changed in 900 seconds
save 300 10     # Save if at least 10 keys changed in 300 seconds
save 60 10000   # Save if at least 10000 keys changed in 60 seconds

# Compress string objects using LZF when dump .rdb databases
rdbcompression yes

# Checksum the RDB file
rdbchecksum yes

# The filename where to dump the DB
dbfilename dump.rdb

# The working directory
dir /data

# ===================================
# Replication Configuration
# ===================================

# Master-Replica replication is asynchronous
repl-diskless-sync no

# Replication backlog size
repl-backlog-size 1mb

# Replication backlog TTL
repl-backlog-ttl 3600

# ===================================
# Security Configuration
# ===================================

# Disable protected mode for development
protected-mode no

# Require clients to issue AUTH <PASSWORD> before processing any other commands
# requirepass dev_redis_password_123

# Rename dangerous commands for security
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
# rename-command CONFIG ""

# ===================================
# Memory Management
# ===================================

# Set a memory usage limit for development (512MB)
maxmemory 512mb

# Memory policy when max memory is reached
# Options: noeviction, allkeys-lru, volatile-lru, allkeys-random, volatile-random, volatile-ttl
maxmemory-policy allkeys-lru

# LRU and minimal TTL algorithms are not precise
maxmemory-samples 5

# ===================================
# Lazy Freeing Configuration
# ===================================

# Lazy freeing of memory
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# ===================================
# Append Only File Configuration
# ===================================

# Enable AOF persistence
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# AOF fsync policy
# Options: always, everysec, no
appendfsync everysec

# Rewrite AOF file when it grows by this percentage
auto-aof-rewrite-percentage 100

# Minimum size for AOF rewrite
auto-aof-rewrite-min-size 64mb

# Load truncated AOF file on startup
aof-load-truncated yes

# Use RDB-AOF hybrid persistence
aof-use-rdb-preamble yes

# ===================================
# Lua Scripting Configuration
# ===================================

# Max execution time for Lua scripts in milliseconds
lua-time-limit 5000

# ===================================
# Slow Log Configuration
# ===================================

# Log queries slower than this many microseconds
slowlog-log-slower-than 10000

# Maximum length of slow log
slowlog-max-len 128

# ===================================
# Latency Monitoring
# ===================================

# Enable latency monitoring
latency-monitor-threshold 100

# ===================================
# Event Notification
# ===================================

# Enable keyspace notifications for development
# K: Keyspace events
# E: Keyevent events
# g: Generic commands (DEL, EXPIRE, RENAME, ...)
# $: String commands
# l: List commands
# s: Set commands
# h: Hash commands
# z: Sorted set commands
# x: Expired events
# e: Evicted events
notify-keyspace-events "Ex"

# ===================================
# Advanced Configuration
# ===================================

# Hash table rehashing
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List compression
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Streams configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
# Format: client-output-buffer-limit <class> <hard limit> <soft limit> <soft seconds>
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol buffer limit
proto-max-bulk-len 512mb

# ===================================
# Connection Configuration
# ===================================

# Set the max number of connected clients
maxclients 10000

# Close connection after client is idle for N seconds
timeout 300

# TCP keepalive
tcp-keepalive 300

# ===================================
# Development Specific Settings
# ===================================

# Disable RDB saves for faster development (comment out for persistence)
# save ""

# Enable debug mode for development
# debug yes

# Enable verbose logging for development
# loglevel verbose

# ===================================
# Performance Tuning
# ===================================

# Disable transparent huge pages
# echo never > /sys/kernel/mm/transparent_hugepage/enabled

# Set appropriate overcommit memory
# echo 1 > /proc/sys/vm/overcommit_memory

# Disable swap for better performance
# swapoff -a

# ===================================
# Monitoring and Statistics
# ===================================

# Enable statistics
# info all

# Enable memory usage tracking
# memory usage <key>

# Enable latency tracking
# latency latest

# ===================================
# Module Configuration
# ===================================

# Load Redis modules (if needed)
# loadmodule /path/to/module.so

# ===================================
# Development Notes
# ===================================
# This configuration is optimized for development environment
# For production use, consider:
# 1. Enable authentication (requirepass)
# 2. Enable protected mode
# 3. Rename dangerous commands
# 4. Adjust memory limits based on available RAM
# 5. Configure proper backup strategy
# 6. Enable SSL/TLS encryption
# 7. Configure proper logging
# 8. Set up monitoring and alerting
# 9. Configure cluster mode if needed
# 10. Optimize for specific use cases (cache vs persistence)

# ===================================
# End of Configuration
# ===================================
