# ===================================
# Task Management System - Nginx Configuration
# ===================================
# Generated for TSK-015-INF-nginx-config
# Project: Task Management System
# Component: Nginx Reverse Proxy & Load Balancer
# Purpose: Production-ready Nginx configuration with security, performance, and monitoring

# ===================================
# Main Context
# ===================================

# Run as nginx user for security
user nginx;

# Number of worker processes (auto = number of CPU cores)
worker_processes auto;

# Error log configuration
error_log /var/log/nginx/error.log warn;

# PID file location
pid /var/run/nginx.pid;

# ===================================
# Events Context
# ===================================
events {
    # Maximum number of simultaneous connections per worker process
    worker_connections 1024;
    
    # Use epoll for better performance on Linux
    use epoll;
    
    # Accept multiple connections at once
    multi_accept on;
}

# ===================================
# HTTP Context
# ===================================
http {
    # ===================================
    # Basic Configuration
    # ===================================
    
    # Include MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Server tokens (hide Nginx version for security)
    server_tokens off;
    
    # ===================================
    # Logging Configuration
    # ===================================
    
    # Log format for detailed access logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    # Access log configuration
    access_log /var/log/nginx/access.log main;
    
    # ===================================
    # Performance Configuration
    # ===================================
    
    # Enable sendfile for better performance
    sendfile on;
    
    # Enable TCP_NOPUSH
    tcp_nopush on;
    
    # Enable TCP_NODELAY
    tcp_nodelay on;
    
    # Keep-alive timeout
    keepalive_timeout 65;
    
    # Types hash configuration
    types_hash_max_size 2048;
    
    # ===================================
    # Buffer Configuration
    # ===================================
    
    # Client body buffer size
    client_body_buffer_size 128k;
    
    # Client header buffer size
    client_header_buffer_size 1k;
    
    # Large client header buffers
    large_client_header_buffers 4 4k;
    
    # Client max body size (for file uploads)
    client_max_body_size 10m;
    
    # ===================================
    # Timeout Configuration
    # ===================================
    
    # Client body timeout
    client_body_timeout 12;
    
    # Client header timeout
    client_header_timeout 12;
    
    # Send timeout
    send_timeout 10;
    
    # ===================================
    # Gzip Compression
    # ===================================
    
    # Enable gzip compression
    gzip on;
    
    # Gzip compression level (1-9, 6 is optimal)
    gzip_comp_level 6;
    
    # Minimum file size to compress
    gzip_min_length 1000;
    
    # Gzip proxied requests
    gzip_proxied any;
    
    # Gzip file types
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        image/svg+xml;
    
    # Disable gzip for IE6
    gzip_disable "msie6";
    
    # ===================================
    # Security Headers
    # ===================================
    
    # Add security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;
    
    # ===================================
    # Rate Limiting
    # ===================================
    
    # Define rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    
    # ===================================
    # Upstream Configuration
    # ===================================
    
    # Backend API servers
    upstream backend_api {
        # Load balancing method (least_conn, ip_hash, random)
        least_conn;
        
        # Backend server instances
        server backend:8000 max_fails=3 fail_timeout=30s;
        # server backend2:8000 max_fails=3 fail_timeout=30s;  # For scaling
        
        # Keep-alive connections to upstream
        keepalive 32;
    }
    
    # Frontend servers
    upstream frontend_app {
        # Load balancing method
        least_conn;
        
        # Frontend server instances
        server frontend:3000 max_fails=3 fail_timeout=30s;
        # server frontend2:3000 max_fails=3 fail_timeout=30s;  # For scaling
        
        # Keep-alive connections to upstream
        keepalive 16;
    }
    
    # ===================================
    # Server Configuration
    # ===================================
    
    # Default server (catch-all)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Return 444 for undefined server names
        return 444;
    }
    
    # Main server configuration
    server {
        # Listen on HTTP and HTTPS
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        
        # Server name (replace with your domain)
        server_name localhost taskmanagement.local;
        
        # ===================================
        # SSL Configuration
        # ===================================
        
        # SSL certificate paths (update for production)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # SSL protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        
        # SSL session configuration
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # ===================================
        # Redirect HTTP to HTTPS
        # ===================================
        
        if ($scheme != "https") {
            return 301 https://$host$request_uri;
        }
        
        # ===================================
        # API Routes
        # ===================================
        
        # API endpoints with rate limiting
        location /api/ {
            # Apply rate limiting
            limit_req zone=api burst=20 nodelay;
            
            # Proxy to backend
            proxy_pass http://backend_api;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Proxy timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Proxy buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            
            # Enable keep-alive to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # Authentication endpoints with stricter rate limiting
        location /api/auth/ {
            # Apply stricter rate limiting for auth
            limit_req zone=login burst=5 nodelay;
            
            # Proxy to backend
            proxy_pass http://backend_api;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Proxy timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # ===================================
        # Health Check Endpoints
        # ===================================
        
        # Nginx health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Backend health check proxy
        location /api/health {
            access_log off;
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
        }
        
        # ===================================
        # Static Files
        # ===================================
        
        # Static assets with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # Proxy to frontend for SPA assets
            proxy_pass http://frontend_app;
            
            # Cache headers
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ===================================
        # Frontend Application
        # ===================================
        
        # Frontend SPA (Single Page Application)
        location / {
            # Proxy to frontend
            proxy_pass http://frontend_app;
            
            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Proxy timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Enable keep-alive to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Handle SPA routing (fallback to index.html)
            try_files $uri $uri/ @fallback;
        }
        
        # Fallback for SPA routing
        location @fallback {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # ===================================
        # Error Pages
        # ===================================
        
        # Custom error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            internal;
            proxy_pass http://frontend_app/404.html;
        }
        
        location = /50x.html {
            internal;
            proxy_pass http://frontend_app/50x.html;
        }
    }
}
