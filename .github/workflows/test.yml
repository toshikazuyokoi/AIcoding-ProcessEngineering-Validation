# ===================================
# Task Management System - Test Workflow
# ===================================
# Generated for TSK-019-ENV-test-workflow
# Project: Task Management System
# Component: Comprehensive Testing Pipeline
# Purpose: Automated testing, quality assurance, and test reporting

name: Test Pipeline

on:
  push:
    branches: [main, develop, augment-*, feature/*, bugfix/*]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of test to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - performance
          - security

env:
  NODE_VERSION: "20.11.0"
  COVERAGE_THRESHOLD: 90
  TEST_TIMEOUT: 300000
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ===================================
  # Stage 1: Test Environment Setup
  # ===================================
  test-environment-setup:
    name: Test Environment Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      test_matrix: ${{ steps.setup-matrix.outputs.matrix }}
      should_run_e2e: ${{ steps.determine-tests.outputs.run_e2e }}
      should_run_performance: ${{ steps.determine-tests.outputs.run_performance }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine test scope
        id: determine-tests
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.test_type }}" = "all" ]; then
            echo "run_e2e=true" >> $GITHUB_OUTPUT
            echo "run_performance=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.test_type }}" = "e2e" ]; then
            echo "run_e2e=true" >> $GITHUB_OUTPUT
            echo "run_performance=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.test_type }}" = "performance" ]; then
            echo "run_e2e=false" >> $GITHUB_OUTPUT
            echo "run_performance=true" >> $GITHUB_OUTPUT
          else
            echo "run_e2e=false" >> $GITHUB_OUTPUT
            echo "run_performance=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup test matrix
        id: setup-matrix
        run: |
          if [ "${{ github.event.inputs.test_type }}" = "unit" ]; then
            echo 'matrix={"component":["backend","frontend"]}' >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.test_type }}" = "integration" ]; then
            echo 'matrix={"component":["backend-integration","frontend-integration"]}' >> $GITHUB_OUTPUT
          else
            echo 'matrix={"component":["backend","frontend","backend-integration","frontend-integration"]}' >> $GITHUB_OUTPUT
          fi

      - name: Cache test dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/ms-playwright
          key: test-deps-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            test-deps-${{ runner.os }}-

  # ===================================
  # Stage 2: Unit & Integration Tests
  # ===================================
  unit-integration-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-environment-setup

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-environment-setup.outputs.test_matrix) }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: task_management_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [[ "${{ matrix.component }}" == *"backend"* ]]; then
            cd backend && npm ci --silent
          fi
          if [[ "${{ matrix.component }}" == *"frontend"* ]]; then
            cd frontend && npm ci --silent
          fi

      - name: Setup test database
        if: contains(matrix.component, 'backend')
        run: |
          cd backend
          npm run db:migrate
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/task_management_test

      - name: Run unit tests
        if: matrix.component == 'backend' || matrix.component == 'frontend'
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            cd backend
            npm run test:unit -- --coverage --watchAll=false --maxWorkers=2
          elif [ "${{ matrix.component }}" = "frontend" ]; then
            cd frontend
            npm run test:unit -- --coverage --watchAll=false --maxWorkers=2
          fi
        env:
          CI: true
          NODE_ENV: test

      - name: Run integration tests
        if: contains(matrix.component, 'integration')
        run: |
          if [ "${{ matrix.component }}" = "backend-integration" ]; then
            cd backend
            npm run test:integration -- --coverage --watchAll=false --maxWorkers=2
          elif [ "${{ matrix.component }}" = "frontend-integration" ]; then
            cd frontend
            npm run test:integration -- --coverage --watchAll=false --maxWorkers=2
          fi
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/task_management_test
          REDIS_URL: redis://localhost:6379

      - name: Check coverage threshold
        run: |
          COMPONENT_DIR=""
          if [[ "${{ matrix.component }}" == *"backend"* ]]; then
            COMPONENT_DIR="backend"
          elif [[ "${{ matrix.component }}" == *"frontend"* ]]; then
            COMPONENT_DIR="frontend"
          fi

          if [ -n "$COMPONENT_DIR" ] && [ -f "$COMPONENT_DIR/coverage/coverage-summary.json" ]; then
            COVERAGE=$(node -e "
              const coverage = require('./$COMPONENT_DIR/coverage/coverage-summary.json');
              console.log(coverage.total.lines.pct);
            ")
            echo "Coverage for ${{ matrix.component }}: $COVERAGE%"

            if (( $(echo "$COVERAGE < ${{ env.COVERAGE_THRESHOLD }}" | bc -l) )); then
              echo "❌ Coverage $COVERAGE% is below threshold ${{ env.COVERAGE_THRESHOLD }}%"
              exit 1
            else
              echo "✅ Coverage $COVERAGE% meets threshold"
            fi
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.component }}
          path: |
            backend/coverage/
            frontend/coverage/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.component }}
          path: |
            backend/test-results/
            frontend/test-results/
          retention-days: 7

  # ===================================
  # Stage 3: Security Tests
  # ===================================
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-environment-setup
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'security' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd backend && npm ci --silent
          cd ../frontend && npm ci --silent

      - name: Run dependency audit
        run: |
          echo "🔍 Running dependency security audit..."

          cd backend
          npm audit --audit-level moderate --json > ../backend-audit.json || true

          cd ../frontend
          npm audit --audit-level moderate --json > ../frontend-audit.json || true

      - name: Run SAST scan
        uses: github/codeql-action/analyze@v3
        with:
          languages: typescript

      - name: Check security vulnerabilities
        run: |
          echo "🔍 Checking security vulnerabilities..."

          # Check backend vulnerabilities
          BACKEND_CRITICAL=$(cat backend-audit.json | jq '.metadata.vulnerabilities.critical // 0')
          BACKEND_HIGH=$(cat backend-audit.json | jq '.metadata.vulnerabilities.high // 0')

          # Check frontend vulnerabilities
          FRONTEND_CRITICAL=$(cat frontend-audit.json | jq '.metadata.vulnerabilities.critical // 0')
          FRONTEND_HIGH=$(cat frontend-audit.json | jq '.metadata.vulnerabilities.high // 0')

          echo "Backend: $BACKEND_CRITICAL critical, $BACKEND_HIGH high"
          echo "Frontend: $FRONTEND_CRITICAL critical, $FRONTEND_HIGH high"

          TOTAL_CRITICAL=$((BACKEND_CRITICAL + FRONTEND_CRITICAL))
          TOTAL_HIGH=$((BACKEND_HIGH + FRONTEND_HIGH))

          if [ $TOTAL_CRITICAL -gt 0 ]; then
            echo "❌ Critical vulnerabilities found: $TOTAL_CRITICAL"
            exit 1
          elif [ $TOTAL_HIGH -gt 5 ]; then
            echo "⚠️ High vulnerabilities found: $TOTAL_HIGH (threshold: 5)"
            exit 1
          else
            echo "✅ Security scan passed"
          fi

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            backend-audit.json
            frontend-audit.json
          retention-days: 30

  # ===================================
  # Stage 4: E2E Tests
  # ===================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-environment-setup, unit-integration-tests]
    if: needs.test-environment-setup.outputs.should_run_e2e == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright
        run: |
          cd frontend
          npm ci --silent
          npx playwright install --with-deps

      - name: Start test environment
        run: |
          echo "🚀 Starting test environment..."
          docker-compose -f docker-compose.test.yml up -d

          # Wait for services to be ready
          echo "⏳ Waiting for services to be ready..."
          timeout 120s bash -c 'until curl -f http://localhost:8001/health; do sleep 2; done'
          timeout 120s bash -c 'until curl -f http://localhost:3001; do sleep 2; done'

      - name: Seed test data
        run: |
          echo "🌱 Seeding test data..."
          cd backend
          npm run test:seed
        env:
          DATABASE_URL: postgresql://test_user:test_password_123@localhost:5433/taskdb_test

      - name: Run E2E tests
        run: |
          echo "🧪 Running E2E tests..."
          cd frontend
          npx playwright test --reporter=html,json
        env:
          BASE_URL: http://localhost:3001
          API_URL: http://localhost:8001

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop test environment
        if: always()
        run: |
          echo "🛑 Stopping test environment..."
          docker-compose -f docker-compose.test.yml down -v

  # ===================================
  # Stage 5: Performance Tests
  # ===================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test-environment-setup, unit-integration-tests]
    if: needs.test-environment-setup.outputs.should_run_performance == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install performance testing tools
        run: |
          npm install -g artillery@latest
          npm install -g lighthouse@latest

      - name: Start performance test environment
        run: |
          echo "🚀 Starting performance test environment..."
          docker-compose -f docker-compose.test.yml up -d backend-test postgres-test redis-test

          # Wait for backend to be ready
          timeout 120s bash -c 'until curl -f http://localhost:8001/health; do sleep 2; done'

      - name: Run API performance tests
        run: |
          echo "⚡ Running API performance tests..."

          # Create Artillery configuration
          cat > artillery-config.yml << EOF
          config:
            target: 'http://localhost:8001'
            phases:
              - duration: 60
                arrivalRate: 10
                name: "Warm up"
              - duration: 120
                arrivalRate: 50
                name: "Load test"
          scenarios:
            - name: "API Health Check"
              weight: 30
              flow:
                - get:
                    url: "/health"
            - name: "Task Operations"
              weight: 70
              flow:
                - post:
                    url: "/api/auth/login"
                    json:
                      email: "test@example.com"
                      password: "password123"
                - get:
                    url: "/api/tasks"
                    headers:
                      Authorization: "Bearer {{ token }}"
          EOF

          artillery run artillery-config.yml --output performance-report.json
          artillery report performance-report.json --output performance-report.html

      - name: Run frontend performance tests
        run: |
          echo "🌐 Running frontend performance tests..."

          # Start frontend for Lighthouse
          docker-compose -f docker-compose.test.yml up -d frontend-test
          timeout 120s bash -c 'until curl -f http://localhost:3001; do sleep 2; done'

          # Run Lighthouse audit
          lighthouse http://localhost:3001 \
            --output=html,json \
            --output-path=./lighthouse-report \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --preset=desktop

      - name: Check performance thresholds
        run: |
          echo "📊 Checking performance thresholds..."

          # Check API performance
          if [ -f "performance-report.json" ]; then
            AVG_RESPONSE_TIME=$(cat performance-report.json | jq '.aggregate.latency.mean')
            echo "Average API response time: ${AVG_RESPONSE_TIME}ms"

            if (( $(echo "$AVG_RESPONSE_TIME > 500" | bc -l) )); then
              echo "❌ API response time ${AVG_RESPONSE_TIME}ms exceeds 500ms threshold"
              exit 1
            fi
          fi

          # Check Lighthouse scores
          if [ -f "lighthouse-report.json" ]; then
            PERFORMANCE_SCORE=$(cat lighthouse-report.json | jq '.categories.performance.score * 100')
            echo "Lighthouse performance score: ${PERFORMANCE_SCORE}"

            if (( $(echo "$PERFORMANCE_SCORE < 80" | bc -l) )); then
              echo "❌ Performance score ${PERFORMANCE_SCORE} is below 80 threshold"
              exit 1
            fi
          fi

          echo "✅ Performance tests passed"

      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            performance-report.html
            performance-report.json
            lighthouse-report.html
            lighthouse-report.json
          retention-days: 30

      - name: Stop performance test environment
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml down -v

  # ===================================
  # Stage 6: Test Results Aggregation
  # ===================================
  test-results-aggregation:
    name: Test Results Aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [unit-integration-tests, security-tests, e2e-tests, performance-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts/

      - name: Generate comprehensive test report
        run: |
          echo "📋 Generating comprehensive test report..."

          cat > test-report.md << EOF
          # Comprehensive Test Report

          ## Test Execution Summary
          - **Timestamp**: $(date -u)
          - **Commit**: ${{ github.sha }}
          - **Branch**: ${{ github.ref_name }}
          - **Trigger**: ${{ github.event_name }}
          - **Test Type**: ${{ github.event.inputs.test_type || 'all' }}

          ## Test Results
          ### Unit & Integration Tests
          - **Backend Unit**: ${{ needs.unit-integration-tests.result }}
          - **Frontend Unit**: ${{ needs.unit-integration-tests.result }}
          - **Backend Integration**: ${{ needs.unit-integration-tests.result }}
          - **Frontend Integration**: ${{ needs.unit-integration-tests.result }}

          ### Security Tests
          - **Dependency Audit**: ${{ needs.security-tests.result }}
          - **SAST Scan**: ${{ needs.security-tests.result }}

          ### E2E Tests
          - **User Scenarios**: ${{ needs.e2e-tests.result }}

          ### Performance Tests
          - **API Performance**: ${{ needs.performance-tests.result }}
          - **Frontend Performance**: ${{ needs.performance-tests.result }}

          ## Coverage Summary
          EOF

          # Add coverage information if available
          if [ -d "test-artifacts/coverage-backend" ]; then
            echo "- **Backend Coverage**: Available in artifacts" >> test-report.md
          fi
          if [ -d "test-artifacts/coverage-frontend" ]; then
            echo "- **Frontend Coverage**: Available in artifacts" >> test-report.md
          fi

          echo "" >> test-report.md
          echo "## Quality Gates" >> test-report.md

          # Check overall test status
          FAILED_TESTS=0

          if [ "${{ needs.unit-integration-tests.result }}" != "success" ]; then
            echo "- ❌ Unit/Integration tests failed" >> test-report.md
            FAILED_TESTS=$((FAILED_TESTS + 1))
          else
            echo "- ✅ Unit/Integration tests passed" >> test-report.md
          fi

          if [ "${{ needs.security-tests.result }}" != "success" ] && [ "${{ needs.security-tests.result }}" != "skipped" ]; then
            echo "- ❌ Security tests failed" >> test-report.md
            FAILED_TESTS=$((FAILED_TESTS + 1))
          else
            echo "- ✅ Security tests passed" >> test-report.md
          fi

          if [ "${{ needs.e2e-tests.result }}" != "success" ] && [ "${{ needs.e2e-tests.result }}" != "skipped" ]; then
            echo "- ❌ E2E tests failed" >> test-report.md
            FAILED_TESTS=$((FAILED_TESTS + 1))
          else
            echo "- ✅ E2E tests passed" >> test-report.md
          fi

          if [ "${{ needs.performance-tests.result }}" != "success" ] && [ "${{ needs.performance-tests.result }}" != "skipped" ]; then
            echo "- ❌ Performance tests failed" >> test-report.md
            FAILED_TESTS=$((FAILED_TESTS + 1))
          else
            echo "- ✅ Performance tests passed" >> test-report.md
          fi

          echo "" >> test-report.md
          if [ $FAILED_TESTS -eq 0 ]; then
            echo "## 🎉 Overall Status: SUCCESS" >> test-report.md
            echo "All quality gates passed!" >> test-report.md
          else
            echo "## ❌ Overall Status: FAILURE" >> test-report.md
            echo "$FAILED_TESTS test stage(s) failed" >> test-report.md
          fi

          cat test-report.md

      - name: Upload comprehensive test report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-report
          path: test-report.md
          retention-days: 90

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-report.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Test Pipeline Results\n\n${report}`
            });

  # ===================================
  # Stage 7: Notification & Cleanup
  # ===================================
  notification:
    name: Test Pipeline Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-results-aggregation]
    if: always()

    steps:
      - name: Determine overall result
        id: result
        run: |
          if [ "${{ needs.test-results-aggregation.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=All tests passed successfully" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=Some tests failed" >> $GITHUB_OUTPUT
          fi

      - name: Send notification
        run: |
          echo "📢 Test Pipeline Notification"
          echo "Status: ${{ steps.result.outputs.status }}"
          echo "Message: ${{ steps.result.outputs.message }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Timestamp: $(date -u)"

          # In real implementation, this would send notifications to:
          # - Slack/Teams channels
          # - Email notifications
          # - Monitoring systems

      - name: Cleanup
        run: |
          echo "🧹 Cleaning up test pipeline resources..."
          echo "Test pipeline completed at $(date -u)"
