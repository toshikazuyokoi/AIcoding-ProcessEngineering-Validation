# A/Bテスト結果
ab_test_results:
  current_tests: []
  completed_tests: []
  # 例: 理論選択アルゴリズムのテスト
  # - test_id: "theory_selection_v2"
  #   start_date: "2025-06-01"
  #   end_date: "2025-06-30"
  #   variants:
  #     control: "current_algorithm"
  #     treatment: "ml_based_algorithm"
  #   metrics:
  #     success_rate:
  #       control: 0.75
  #       treatment: 0.82
  #     user_satisfaction:
  #       control: 3.8
  #       treatment: 4.1
  #   conclusion: "ML-based algorithm shows 9% improvement"

  # 異常検知
anomaly_detection:
  enabled: true
  thresholds:
    low_usage_threshold: 0.1 # 使用率が10%以下
    high_failure_threshold: 0.3 # 失敗率が30%以上
    performance_degradation_threshold: 2.0 # 平均の2倍以上の処理時間

  detected_anomalies: []
  # 例: 異常検知結果
  # - timestamp: "2025-06-28T10:00:00Z"
  #   type: "low_usage"
  #   theory: "progress-management"
  #   metric: "usage_rate"
  #   value: 0.05
  #   threshold: 0.1
  #   action_taken: "investigate_user_feedback"

  # レポート生成設定
reporting:
  auto_reports:
    daily: true
    weekly: true
    monthly: true

  report_recipients: []

  custom_metrics: []

  export_formats: [ "yaml", "json", "csv" ]

# データ保持ポリシー
data_retention:
  raw_data_retention_days: 90
  aggregated_data_retention_days: 365
  anonymization_after_days: 30

  backup_frequency: "daily"
  backup_location: "metadata/backups/"
