# カテゴリ別インデックス
categories:
  core:
    description: "必須の核心理論 (常時ロード)"
    total_tokens: 1000
    theories: [ "process-essence", "quality-principles", "task-fundamentals" ]

  guide:
    description: "条件付き実装ガイド"
    total_tokens: 3000
    theories: [ "scale-detection", "category-design", "selective-expansion", "progress-management" ]

  detailed:
    description: "オンデマンド詳細仕様"
    total_tokens: 10000
    theories: [] # 詳細仕様は別途定義

# 適用性インデックス
applicability_index:
  by_project_size:
    small:
      required: [ "process-essence", "quality-principles", "task-fundamentals" ]
      optional: []

    medium:
      required: [ "process-essence", "quality-principles", "task-fundamentals" ]
      recommended: [ "scale-detection", "category-design" ]
      optional: [ "selective-expansion", "progress-management" ]

    large:
      required: [ "process-essence", "quality-principles", "task-fundamentals" ]
      recommended: [ "scale-detection", "category-design", "selective-expansion", "progress-management" ]
      optional: []

  by_complexity:
    low:
      required: [ "process-essence", "task-fundamentals" ]
      optional: [ "quality-principles" ]

    medium:
      required: [ "process-essence", "quality-principles", "task-fundamentals" ]
      recommended: [ "scale-detection" ]
      optional: [ "category-design", "selective-expansion" ]

    high:
      required: [ "process-essence", "quality-principles", "task-fundamentals" ]
      recommended: [ "scale-detection", "category-design", "selective-expansion", "progress-management" ]
      optional: []

  by_phase:
    step_0_goal_definition:
      theories: [ "process-essence", "quality-principles" ]

    step_1_requirements:
      theories: [ "process-essence", "quality-principles", "scale-detection" ]

    step_2_system_design:
      theories: [ "process-essence", "quality-principles", "category-design" ]

    step_3_detailed_design:
      theories: [ "process-essence", "quality-principles", "category-design" ]

    step_5_development_planning:
      theories: [ "task-fundamentals", "category-design", "progress-management" ]

    step_6_task_creation:
      theories: [ "task-fundamentals", "selective-expansion" ]

    step_7_implementation:
      theories: [ "quality-principles", "selective-expansion", "progress-management" ]

    step_8_continuous_improvement:
      theories: [ "process-essence", "progress-management" ]

